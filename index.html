    <!-- Third-party scripts: deferred until after first user interaction for better INP -->
    <script>
      let scriptsLoaded = false;
      function loadDeferredScripts() {
        if (scriptsLoaded) return;
        scriptsLoaded = true;

        // Clean up event listeners
        ["scroll", "mousemove", "touchstart", "click", "keydown"].forEach(
          (event) => {
            window.removeEventListener(event, loadDeferredScripts, {
              passive: true,
            });
          },
        );

        // Google AdSense
        var ads = document.createElement("script");
        ads.src =
          "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2980455227951378";
        ads.crossOrigin = "anonymous";
        ads.async = true;
        ads.onload = function () {
          // Enable page-level ads (anchor/vignette Auto Ad formats)
          (window.adsbygoogle = window.adsbygoogle || []).push({
            google_ad_client: "ca-pub-2980455227951378",
            enable_page_level_ads: true,
          });
          // Notify AdUnit components that AdSense is ready
          window.dispatchEvent(new Event("adsense-ready"));
        };
        document.head.appendChild(ads);

        // Google Analytics
        var ga = document.createElement("script");
        ga.src = "https://www.googletagmanager.com/gtag/js?id=G-Y3N6YXK7VE";
        ga.async = true;
        ga.onload = function () {
          window.dataLayer = window.dataLayer || [];
          function gtag() {
            dataLayer.push(arguments);
          }
          gtag("js", new Date());
          gtag("config", "G-Y3N6YXK7VE");
        };
        document.head.appendChild(ga);

        // Microsoft Clarity
        (function (c, l, a, r, i, t, y) {
          c[a] =
            c[a] ||
            function () {
              (c[a].q = c[a].q || []).push(arguments);
            };
          t = l.createElement(r);
          t.async = 1;
          t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "uu67di7l76");
      }

      let interactionTimer;
      function handleInteraction() {
        if (scriptsLoaded) return;
        
        // Yield to the browser to paint the interaction first (fixes INP)
        if (!interactionTimer) {
          interactionTimer = setTimeout(loadDeferredScripts, 150);
        }
      }

      // Load external scripts ONLY after first explicit user interaction to prevent INP penalties
      ["scroll", "mousemove", "touchstart", "click", "keydown"].forEach(
        (event) => {
          window.addEventListener(event, handleInteraction, {
            once: true,
            passive: true,
          });
        },
      );

      // Fallback: If no interaction within 8 seconds, load anyway
      setTimeout(loadDeferredScripts, 8000);
    </script>
